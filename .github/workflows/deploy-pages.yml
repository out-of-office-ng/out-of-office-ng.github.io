name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Node.js ⚙️
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies 🔧
        run: npm ci || npm install

      - name: Build static bundle with base path 🏗️
        env:
          VITE_PAYSTACK_PUBLIC_KEY: ${{ secrets.VITE_PAYSTACK_PUBLIC_KEY }}
        run: npx vite build --base=/

      # v1 is frozen on the `v1` branch and kept live at /v1/ during the overhaul.
      - name: Build archived v1 into /v1/ 🗄️
        env:
          VITE_PAYSTACK_PUBLIC_KEY: ${{ secrets.VITE_PAYSTACK_PUBLIC_KEY }}
        run: |
          git fetch --depth=1 origin v1:v1
          git worktree add "$RUNNER_TEMP/v1" v1
          cd "$RUNNER_TEMP/v1"
          npm ci || npm install
          npx vite build --base=/v1/ --outDir "$GITHUB_WORKSPACE/dist/v1" --emptyOutDir

      - name: Setup Pages 📐
        uses: actions/configure-pages@v5

      - name: Upload build artifact 📦
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages 🚀
        id: deployment
        uses: actions/deploy-pages@v4
