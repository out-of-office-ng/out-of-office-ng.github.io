<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (() => {
        let theme = 'system';
        try { theme = localStorage.getItem('ooo-theme') || 'system'; } catch {}
        document.documentElement.dataset.theme = theme === 'dark' || (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Out of Office Lagos — Make room for a day off</title>
    <meta name="description" content="A Lagos community creating spaces to clock out of the everyday and reconnect with yourself, others, and the things that make life feel good." />
    <!-- Open Graph (WhatsApp, Facebook, LinkedIn). Absolute URLs: WhatsApp ignores relative images. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Out of Office Lagos" />
    <meta property="og:url" content="https://out-of-office-ng.github.io/" />
    <meta property="og:title" content="Out of Office Lagos — Make room for a day off" />
    <meta property="og:description" content="A Lagos community creating spaces to clock out of the everyday and reconnect with yourself, others, and the things that make life feel good." />
    <meta property="og:image" content="https://out-of-office-ng.github.io/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Out of Office: Make room for a day off, with photos from Open Canvas and Release and Unwind" />
    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Out of Office Lagos — Make room for a day off" />
    <meta name="twitter:description" content="A Lagos community creating spaces to clock out of the everyday and reconnect with yourself, others, and the things that make life feel good." />
    <meta name="twitter:image" content="https://out-of-office-ng.github.io/og-image.jpg" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
